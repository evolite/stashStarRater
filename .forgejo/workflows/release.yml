on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: orange-runner
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          export SONAR_SCANNER_VERSION=8.0.1.6346
          export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64
          curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
          export PATH=$SONAR_SCANNER_HOME/bin:$PATH
          sonar-scanner -Dsonar.token=$SONAR_TOKEN -Dsonar.host.url=$SONAR_HOST_URL

      - name: Create zip
        run: python3 -c "import zipfile; z=zipfile.ZipFile('stashStarRater.zip','w',zipfile.ZIP_DEFLATED); z.write('stashStarRater.yml'); z.write('stashStarRater.js'); z.close()"

      - name: Compute sha256
        id: sha
        run: echo "hash=$(sha256sum stashStarRater.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Parse version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version in yml
        run: |
          sed -i "s/^version: .*/version: ${{ steps.ver.outputs.version }}/" stashStarRater.yml
          git config user.email "ci@codeberg.org"
          git config user.name "CI"
          git add stashStarRater.yml
          git diff --staged --quiet || git commit -m "Bump version to v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - name: Delete existing release
        run: |
          ID=$(curl -sL \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            "https://codeberg.org/api/v1/repos/surging9143/stashStarRater/releases/tags/${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('id',''))" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            curl -sL -X DELETE \
              -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
              "https://codeberg.org/api/v1/repos/surging9143/stashStarRater/releases/$ID"
          fi

      - name: Create release
        id: release
        run: |
          SHA=$(git rev-parse HEAD)
          RESP=$(curl -sL -X POST \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/surging9143/stashStarRater/releases" \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"body\":\"Release ${GITHUB_REF_NAME}\",\"target_commitish\":\"$SHA\",\"draft\":false,\"prerelease\":false}")
          echo "id=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")" >> $GITHUB_OUTPUT

      - name: Upload zip asset
        run: |
          curl -sL -X POST \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://codeberg.org/api/v1/repos/surging9143/stashStarRater/releases/${{ steps.release.outputs.id }}/assets?name=stashStarRater.zip" \
            --data-binary "@stashStarRater.zip"

      - name: Update pages index
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          HASH: ${{ steps.sha.outputs.hash }}
          TAG: ${{ github.ref_name }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git config --global user.email "ci@codeberg.org"
          git config --global user.name "CI"
          git clone "https://surging9143:${CODEBERG_TOKEN}@codeberg.org/surging9143/pages.git" /tmp/pages
          export DATE=$(date +"%Y-%m-%d %H:%M:%S")
          export URL="https://codeberg.org/surging9143/stashStarRater/releases/download/${TAG}/stashStarRater.zip"
          python3 .forgejo/update_pages.py
          cd /tmp/pages
          git add index.yml
          git diff --staged --quiet || git commit -m "Update stashStarRater to v${VERSION}"
          git push
